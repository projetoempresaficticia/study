name: Update study plan

on:
  repository_dispatch:
    types: [toggle-slot, set-slot, log-session]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install openpyxl
        run: pip install openpyxl

      - name: Apply update to xlsx
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: python scripts/apply_update.py "${{ github.event.action }}" "$PAYLOAD"

      - name: Regenerate data/study-plan.json
        run: python scripts/xlsx_to_json.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "STUDY PLAN 2026.xlsx" data/study-plan.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: ${{ github.event.action }} via site"
            git push
          fi
